<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyra Feature Graphic</title>
    <style>
      html,
      body {
        width: 1024px;
        height: 500px;
        margin: 0;
        overflow: hidden;
        background: #0f172a;
        font-family: Inter, Arial, sans-serif;
      }

      .banner {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 16%, rgba(6, 182, 212, .34), transparent 30%),
          radial-gradient(circle at 82% 74%, rgba(29, 78, 216, .56), transparent 36%),
          linear-gradient(135deg, #07111f 0%, #0f172a 42%, #11284d 100%);
        color: #fff;
      }

      .banner::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: .24;
        background:
          linear-gradient(rgba(89, 183, 255, .14) 1px, transparent 1px),
          linear-gradient(90deg, rgba(89, 183, 255, .14) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: radial-gradient(circle at 52% 50%, #000 0%, transparent 67%);
      }

      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(2px);
      }

      .orb.one {
        width: 360px;
        height: 360px;
        left: -96px;
        top: 158px;
        background: radial-gradient(circle, rgba(6, 182, 212, .24), transparent 68%);
      }

      .orb.two {
        width: 420px;
        height: 420px;
        right: -122px;
        top: -96px;
        background: radial-gradient(circle, rgba(45, 127, 249, .28), transparent 68%);
      }

      .content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .glass {
        width: 780px;
        padding: 54px 64px 50px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 44px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04)),
          rgba(15, 23, 42, .48);
        box-shadow:
          0 46px 120px rgba(0, 0, 0, .34),
          inset 0 1px 0 rgba(255, 255, 255, .16);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 22px;
      }

      .brand-icon {
        width: 84px;
        height: 84px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(6, 182, 212, .5));
      }

      .wordmark {
        width: 318px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 16px 28px rgba(0, 0, 0, .24));
      }

      h1 {
        margin: 0;
        font-size: 44px;
        line-height: 1.04;
        font-weight: 850;
        letter-spacing: -.035em;
      }

      p {
        margin: 18px auto 0;
        max-width: 650px;
        color: rgba(255, 255, 255, .78);
        font-size: 24px;
        line-height: 1.32;
        font-weight: 600;
      }

      .shine {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 74px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(89, 183, 255, .7), transparent);
      }
    </style>
  </head>
  <body>
    <main class="banner">
      <div class="orb one"></div>
      <div class="orb two"></div>
      <section class="content">
        <div class="glass">
          <div class="brand">
            <img class="brand-icon" src="./lyra-logo-icon-official.png" alt="" />
            <img class="wordmark" src="./lyra-wordmark-official-white.png" alt="Lyra" />
          </div>
          <h1>Gestão Odontológica Inteligente</h1>
          <p>Agenda, prontuário, WhatsApp, financeiro e IA em uma única plataforma.</p>
        </div>
      </section>
      <div class="shine"></div>
    </main>
  </body>
</html>
