<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Lyra</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(560px, 100%); text-align: center; }
      img { width: 88px; height: auto; margin: 0 auto 24px; }
      h1 { margin: 0 0 12px; font-size: clamp(36px, 8vw, 64px); letter-spacing: 0; }
      p { margin: 0 auto 28px; max-width: 480px; color: #475569; font-size: 18px; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 22px; border-radius: 999px; background: linear-gradient(90deg, #1d4ed8, #06b6d4); color: #fff; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #06b6d4; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo-icon.png" alt="" width="1024" height="682" />
      <h1>Página não encontrada</h1>
      <p>O endereço pode ter mudado. Volte para a página principal do Lyra para continuar.</p>
      <a href="/">Voltar para o início</a>
    </main>
  </body>
</html>
