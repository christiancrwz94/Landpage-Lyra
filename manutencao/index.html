<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Lyra Dental | Voltamos em breve</title>
<style>
  :root{--bg:#f8f6ef;--ink:#29342e;--muted:#5b675f;--verde:#435e52}
  @media (prefers-color-scheme:dark){:root{--bg:#111715;--ink:#f2f4ef;--muted:#c7cec7;--verde:#a7c3ae}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  main{max-width:460px}
  img{width:64px;height:auto;margin:0 auto 22px;display:block}
  h1{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.15;margin:0 0 12px;color:var(--verde)}
  p{margin:0 0 10px;line-height:1.55;color:var(--muted)}
  a{color:var(--verde);font-weight:600}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="" />
  <h1>Estamos ajustando alguns detalhes</h1>
  <p>O site do Lyra Dental volta em breve.</p>
  <p>Dúvidas? Escreva para <a href="mailto:contato@getlyra.com.br">contato@getlyra.com.br</a>.</p>
</main>
</body>
</html>
