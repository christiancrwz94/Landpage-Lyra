<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo_lyra.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lyra — Login</title>
    <meta name="description" content="Acesse o Lyra — O sistema inteligente de gestão odontológica." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="dark-theme login-page-body">
    <div id="app" class="login-wrapper">
      <!-- Glow Backgrounds -->
      <div class="glow-bg glow-primary"></div>
      <div class="glow-bg glow-secondary"></div>



      <!-- Center Login Card -->
      <main class="login-main-content">
        <div class="login-card-container">
          <div class="login-header">
            <div class="logo-badge">
              <img src="/src/assets/logo_lyra.svg" alt="Lyra" class="login-logo-icon" />
            </div>
          </div>

          <form id="login-form" class="login-form">
            <div class="form-group">
              <label for="login-email" class="form-label">E-mail</label>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input type="email" id="login-email" class="form-input" placeholder="seuemail@clinica.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="login-password" class="form-label">Senha</label>
                <a href="https://app.getlyra.com.br/forgot-password" class="forgot-link">Esqueceu a senha?</a>
              </div>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
                <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Mostrar ou ocultar senha">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-off-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" x2="22" y1="2" y2="22"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block btn-login-submit">
              <span>Entrar no Sistema</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-arrow-icon">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
              </svg>
            </button>
          </form>

          <div class="login-footer-links">
            <p>Ainda não possui uma conta?</p>
            <a href="https://app.getlyra.com.br/register" class="btn-register-link">Criar conta no Lyra</a>
          </div>
        </div>

        <div class="login-security-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Conexão criptografada e segura</span>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
